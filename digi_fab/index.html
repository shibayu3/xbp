<style>
* {

padding: 0;

html {

body {
background: #101110;
color: #f5f5f0;
font-family: Arial, "Noto Sans JP", sans-serif;

}

header {
height: 80px;
padding: 0 8%;
display: flex;
justify-content: space-between;

}

.logo {
color: #c5ff45;
font-size: 28px;
font-weight: 900;
letter-spacing: 3px;
}

.back-link {
color: #aaa;
text-decoration: none;
font-size: 13px;
transition: 0.3s;
}

.back-link:hover {
color: #c5ff45;
}

main {
max-width: 1100px;
margin: 0 auto;
padding: 90px 8%;
}

.label {
color: #c5ff45;
font-size: 12px;
letter-spacing: 5px;
margin-bottom: 20px;
}

h1 {
font-size: clamp(32px, 6vw, 60px);
line-height: 1.4;
margin-bottom: 20px;
}

h1 span {
color: #c5ff45;
}

.description {
color: #999;
font-size: 14px;

margin-bottom: 65px;
}

.section-heading {
font-size: 23px;
margin-bottom: 25px;
}

.section-heading span {
color: #c5ff45;
font-size: 12px;
letter-spacing: 3px;
margin-right: 12px;
}

.note-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 20px;
}

.note-card {
display: block;
padding: 32px;
min-height: 190px;
background: #1b1e19;
border: 1px solid #30352c;
border-radius: 12px;
color: white;
text-decoration: none;
transition: 0.3s;
}

.note-card:hover {
transform: translateY(-6px);
border-color: #c5ff45;
background: #22271e;
}

.note-number {
color: #c5ff45;
font-size: 13px;
letter-spacing: 2px;
margin-bottom: 22px;
}

.note-title {
font-size: 22px;
font-weight: bold;
margin-bottom: 15px;
}

.note-bottom {
display: flex;
justify-content: space-between;
align-items: center;
}

.note-caption {
color: #888;
font-size: 12px;
}

.arrow {
color: #c5ff45;
font-size: 25px;
}

footer {
padding: 30px;
text-align: center;
color: #777;
font-size: 11px;
letter-spacing: 2px;
border-top: 1px solid #292c27;
}

@media (max-width: 650px) {
header {
padding: 0 6%;
}

main {
padding: 65px 6%;
}

.note-grid {
grid-template-columns: 1fr;
}

.note-card {
min-height: 160px;
padding: 25px;
}

.note-title {
font-size: 19px;
}
}
</style>
